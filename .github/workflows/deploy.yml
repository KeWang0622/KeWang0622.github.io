name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3
    - name: Set up navigation checks
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Check world movement and collision geometry
      run: node --test pokemon/3d/*.test.mjs
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.1'
        bundler-cache: true
    - name: Install and Build 🔧
      run: |
        npm install -g mermaid.cli
        bundle exec jekyll build
    - name: Save pull request preview
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: website-preview
        path: _site
        retention-days: 7
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site

